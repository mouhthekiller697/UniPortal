<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Portal Of Higher Education</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      integrity="sha512-4oVgB2h2b7ABYQiQOslvJ5rKC2yLkU3O4hG6nqNn5YpUqG4Qm2jRm1Xf9H6F0sVQ2G0uNQAwj4A4yx4jAT7E0g=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">The Portal Of Higher Education</div>
      <nav class="site-nav">
        <a href="index.html">Home</a>
      </nav>
    </header>

    <main>
      <section class="hero">
        <h1>Welcome to The Portal Of Higher Education</h1>
        <p>
          Search for Algerian universities and superior schools, then dive into their programs,
          certificates, and locations across the country.
        </p>
        <form class="search-form" id="search-form">
          <input
            type="text"
            id="search-input"
            name="search"
            list="establishment-list"
            placeholder="Search for a university or superior school"
            autocomplete="off"
            required
          />
          <datalist id="establishment-list"></datalist>
          <button type="submit">Search</button>
        </form>
        <div class="search-feedback" id="search-feedback" role="status" aria-live="polite"></div>
        <div class="results" id="search-results"></div>
      </section>
    </main>

    <footer class="site-footer">
      <div>made with <span class="heart">❤</span> by MouhTheKiller</div>
      <a class="github-link" href="https://github.com/mouhthekiller697" target="_blank" rel="noopener">
        <i class="fa-brands fa-github" aria-hidden="true"></i>
        <span>GitHub</span>
      </a>
    </footer>

    <script src="scripts/home.js" defer></script>
  </body>
</html>
