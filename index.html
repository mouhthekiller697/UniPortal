<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>UniPortSite</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="site-header">
      <div class="brand">UniPortSite</div>
      <div class="header-right">
        <nav class="site-nav">
          <a href="index.html">Home</a>
          <a href="compare.html">Compare</a>
        </nav>
        <button
          class="theme-toggle"
          type="button"
          data-theme-toggle
          aria-label="Switch theme"
          title="Switch theme"
        >
          <i class="fa-solid fa-sun" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <main>
      <section class="hero">
        <h1>Welcome to UniPortSite</h1>
        <p>
          Search for Algerian universities and superior schools, then dive into their programs,
          certificates, and locations across the country.
        </p>
        <form class="search-form" id="search-form" autocomplete="off">
          <div class="autocomplete" id="autocomplete">
            <input
              type="text"
              id="search-input"
              name="search"
              list="establishment-list"
              placeholder="Search for a university or superior school"
              autocomplete="off"
              required
              aria-autocomplete="list"
              aria-expanded="false"
              aria-controls="autocomplete-list"
            />
            <datalist id="establishment-list"></datalist>
            <ul
              class="autocomplete-list"
              id="autocomplete-list"
              role="listbox"
              aria-label="Search suggestions"
              hidden
            ></ul>
          </div>
          <button type="submit">Search</button>
        </form>
        <div class="search-feedback" id="search-feedback" role="status" aria-live="polite"></div>
        <div class="results" id="search-results"></div>
        <section class="compare-entry">
          <h2>Compare two universities</h2>
          <form class="compare-form" id="compare-form">
            <select id="compare-first" required>
              <option value="">Choose first institution</option>
            </select>
            <select id="compare-second" required>
              <option value="">Choose second institution</option>
            </select>
            <button type="submit">Compare</button>
          </form>
          <p class="compare-feedback" id="compare-feedback" role="status" aria-live="polite"></p>
        </section>
      </section>
    </main>

    <footer class="site-footer">
      <div>made with <span class="heart">❤</span> by MouhTheKiller</div>
      <a class="github-link" href="https://github.com/mouhthekiller697" target="_blank" rel="noopener">
        <i class="fa-brands fa-github" aria-hidden="true"></i>
        <span>GitHub</span>
      </a>
    </footer>

    <script src="scripts/data-utils.js" defer></script>
    <script src="scripts/theme.js" defer></script>
    <script src="scripts/home.js" defer></script>
  </body>
</html>
